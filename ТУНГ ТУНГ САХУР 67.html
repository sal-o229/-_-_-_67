const cvs=[];
const SV=document.createElement('video');SV.src=SAH;SV.muted=true;SV.loop=true;SV.playsInline=true;SV.autoplay=true;SV.setAttribute('style','position:fixed;width:1px;height:1px;opacity:0;pointer-events:none');document.body.appendChild(SV);
const PC=document.createElement('canvas');PC.width=PC.height=452;const px=PC.getContext('2d',{willReadFrequently:true});
let lastT=-1;
function frame(){
  if(SV.readyState>=2&&SV.currentTime!==lastT){
    lastT=SV.currentTime;
    px.clearRect(0,0,452,452);px.drawImage(SV,0,0,452,452);
    const im=px.getImageData(0,0,452,452),q=im.data;
    for(let i=0;i<q.length;i+=4){const m=Math.max(q[i],q[i+1],q[i+2]);q[i+3]=m<28?0:m<60?(m-28)*8:255;}
    px.putImageData(im,0,0);
    for(const c of cvs){c.clearRect(0,0,452,452);c.drawImage(PC,0,0);}
  }
  requestAnimationFrame(frame);
}
SV.play().catch(()=>{});frame();
const stage=document.getElementById('stage');
for(let i=0;i<5;i++){
  const d=document.createElement('div');d.className='sahur';
  d.style.left=rnd(12,88)+'%';d.style.top=rnd(18,80)+'%';
  d.style.animationDuration=rnd(.8,1.6)+'s';d.style.animationDelay=rnd(0,1)+'s';
  const cv=document.createElement('canvas');cv.width=cv.height=452;d.appendChild(cv);cvs.push(cv.getContext('2d'));
  const s=d.firstChild.style;s.setProperty('--d',rnd(1.2,4)+'s');s.setProperty('--h',rnd(1.5,5)+'s');s.animationDelay='0s,'+(-rnd(0,5))+'s';
  if(Math.random()<.5)s.animationDirection='reverse,normal';
  stage.appendChild(d);
}
const words=['67','6 7','SIX SEVEN','67','СИКС СЕВЕН','6️⃣7️⃣'];
for(let i=0;i<10;i++){
  const n=document.createElement('div');n.className='n67';n.textContent=words[i%words.length];
  n.style.left=rnd(8,80)+'%';n.style.top=rnd(10,85)+'%';
  n.style.animationDelay=(-rnd(0,2))+'s,'+(-rnd(0,2))+'s';n.style.animationDuration=rnd(.3,.7)+'s,'+rnd(1.5,3)+'s';
  stage.appendChild(n);
}
function playAll(){document.querySelectorAll('video').forEach(v=>{v.muted=true;v.play().catch(()=>{});});}
playAll();

/* ---- звук ---- */
let ac,step=0,timer,muted=false;
function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);}
function tung(t,v=.5){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(110,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.2);}
function fart(t){const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(120,t);o.frequency.linearRampToValueAtTime(45,t+.3);g.gain.setValueAtTime(.25,t);g.gain.linearRampToValueAtTime(0,t+.32);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.35);}
const hz=n=>261.63*Math.pow(2,n/12);
const mel=[0,4,7,4,12,7,9,5, 7,11,14,11,19,14,16,12, 0,7,4,12,9,7,4,2, 5,9,12,9,17,14,12,7];
function tick(){
  const t=ac.currentTime+.05,i=step%mel.length;
  if(!muted){
    tung(t,step%2?.25:.5);
    tone(hz(mel[i]),t,.14,'square',.07);
    if(step%4===0)tone(hz(mel[i]-24),t,.3,'triangle',.18);
    if(step%8===6)tone(hz(mel[i]+12),t,.08,'square',.05);
    if(step%16===15){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(800,t+.15);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.22);}
  }
  step++;
}
document.getElementById('go').addEventListener('click',e=>{
  e.stopPropagation();
  try{ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();timer=setInterval(tick,185);}catch(err){}
  document.getElementById('start').remove();playAll();
});
const mb=document.getElementById('mute');
mb.addEventListener('pointerdown',e=>{e.stopPropagation();muted=!muted;mb.textContent=muted?'🔇':'🔊';});

/* ---- какашки ---- */
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('#start')||e.target.id==='mute')return;
  const H=innerHeight;
  for(let i=0;i<7;i++){
    const p=document.createElement('img');p.className='poop';p.src=POOP;
    p.style.left=(e.clientX+rnd(-30,30))+'px';p.style.top=(e.clientY+rnd(-10,10))+'px';
    document.body.appendChild(p);
    const dy=H-e.clientY+80,dx=rnd(-60,60),r=rnd(-540,540);
    p.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${dx}px,${dy}px) rotate(${r}deg)`}],
      {duration:rnd(800,1500),delay:i*60,easing:'cubic-bezier(.5,0,1,.7)',fill:'backwards'}).onfinish=()=>p.remove();
  }
  if(ac&&!muted){fart(ac.currentTime);tung(ac.currentTime,.7);}
});
</script>
